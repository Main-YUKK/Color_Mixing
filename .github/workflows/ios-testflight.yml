
name: iOS Build & TestFlight Internal

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight-upload
  cancel-in-progress: false
  queue: max

env:
  # Folder project Unity di dalam repo
  PROJECT_DIR: Color_mixing

jobs:
  build-and-deploy:
    name: Build Unity, sign & upload to Internal TestFlight

    # macOS diperlukan untuk post-build plugin Apple
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. Cache Unity Library
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_DIR }}/Library
          key: Library-iOS-macOS-${{ hashFiles('Color_mixing/Assets/**', 'Color_mixing/Packages/**', 'Color_mixing/ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-macOS-

      # 3. Build Unity iOS
      - name: Build Unity iOS
        uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_DIR }}
          targetPlatform: iOS
          unityVersion: auto
          cliVersion: v0.1.77

      # 4. Check Xcode build output
      - name: List build output
        run: |
          find . -maxdepth 4 -name "*.xcodeproj" \
            -not -path "./.git/*" || true

      # 5. Setup Ruby & Bundler
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ${{ env.PROJECT_DIR }}

      # 6. Fastlane Internal Beta
      - name: Fastlane Internal Beta
        working-directory: ${{ env.PROJECT_DIR }}
        run: bundle exec fastlane ios beta
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          MATCH_REPOSITORY: ${{ secrets.MATCH_REPOSITORY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
