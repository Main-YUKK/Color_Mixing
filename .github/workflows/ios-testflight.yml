name: iOS Build & TestFlight

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # Folder project Unity di dalam repo (huruf besar/kecil harus persis)
  PROJECT_DIR: Color_mixing

jobs:
  build-and-deploy:
    name: Build Unity, sign & upload ke TestFlight
    # Harus macOS: post-build plugin Apple (Core/GameKit) hanya jalan di
    # UNITY_EDITOR_OSX. Kalau build di Linux, framework native-nya tidak masuk
    # ke project Xcode dan link gagal (undefined symbol _NSError_GetCode, dll).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_DIR }}/Library
          key: Library-iOS-macOS-${{ hashFiles('Color_mixing/Assets/**', 'Color_mixing/Packages/**', 'Color_mixing/ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-macOS-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_DIR }}
          targetPlatform: iOS
          unityVersion: auto

      # Tampilkan lokasi hasil build (membantu kalau path perlu disesuaikan)
      - name: List build output
        run: find . -maxdepth 4 -name "*.xcodeproj" -not -path "./.git/*" || true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ${{ env.PROJECT_DIR }}

      - name: Fastlane beta
        working-directory: ${{ env.PROJECT_DIR }}
        run: bundle exec fastlane ios beta
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          MATCH_REPOSITORY: ${{ secrets.MATCH_REPOSITORY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
