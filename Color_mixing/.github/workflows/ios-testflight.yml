
  build-testflight:
    name: Build iOS and Upload TestFlight
    needs: test-unity
    runs-on: macos-15

    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

    steps:
      - name: Download Xcode project
        uses: actions/download-artifact@v4
        with:
          name: ios-xcode-project
          path: build/iOS

      - name: Install signing files
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          files = {
              "certificate.p12": "IOS_CERTIFICATE_BASE64",
              "profile.mobileprovision": "IOS_PROVISIONING_PROFILE_BASE64",
          }

          for filename, secret in files.items():
              data = base64.b64decode(os.environ[secret])
              (temp / filename).write_bytes(data)
          PY

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"

          security set-keychain-settings \
            -lut 21600 "$RUNNER_TEMP/build.keychain"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"

          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$RUNNER_TEMP/build.keychain" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"

          security list-keychains -d user -s \
            "$RUNNER_TEMP/build.keychain"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          security cms -D \
            -i "$RUNNER_TEMP/profile.mobileprovision" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy \
            -c 'Print UUID' "$RUNNER_TEMP/profile.plist")

          PROFILE_NAME=$(/usr/libexec/PlistBuddy \
            -c 'Print Name' "$RUNNER_TEMP/profile.plist")

          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Archive iOS application
        run: |
          xcodebuild \
            -project build/iOS/Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Game.xcarchive" \
            archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Prepare export options
        env:
          APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$APP_BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Game.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        env:
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path

          key_path = Path(os.environ["RUNNER_TEMP"]) / f"AuthKey_{os.environ['ASC_KEY_ID']}.p8"
          key_path.write_bytes(base64.b64decode(os.environ["ASC_PRIVATE_KEY_BASE64"]))
          PY

          gem install fastlane --no-document

          mkdir -p fastlane
          cat > fastlane/Fastfile <<'RUBY'
          default_platform(:ios)

          platform :ios do
            lane :upload_ci do
              api_key = app_store_connect_api_key(
                key_id: ENV["ASC_KEY_ID"],
                issuer_id: ENV["ASC_ISSUER_ID"],
                key_filepath: File.join(
                  ENV["RUNNER_TEMP"],
                  "AuthKey_#{ENV["ASC_KEY_ID"]}.p8"
                )
              )

              pilot(
                api_key: api_key,
                ipa: Dir[File.join(ENV["RUNNER_TEMP"], "export", "*.ipa")].first,
                skip_waiting_for_build_processing: true
              )
            end
          end
          RUBY

          bundle exec fastlane ios upload_ci
