
name: iOS Build & TestFlight External

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight-upload
  cancel-in-progress: false
  queue: max

env:
  # Folder project Unity di dalam repo
  PROJECT_DIR: Color_mixing

jobs:
  build-and-deploy:
    name: Build Unity, sign & upload to External TestFlight

    # macOS diperlukan untuk post-build plugin Apple.
    # Pakai image xcode-27: macos-latest masih default ke Xcode 26.x (iOS 26 SDK),
    # sedangkan mulai April 2027 App Store Connect mewajibkan iOS 27 SDK (ITMS-90725).
    runs-on: xcode-27
    timeout-minutes: 90

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. Cache Unity Library
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_DIR }}/Library
          key: Library-iOS-macOS-${{ hashFiles('Color_mixing/Assets/**', 'Color_mixing/Packages/**', 'Color_mixing/ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-macOS-

      # 3. Build Unity iOS
      - name: Build Unity iOS
        uses: game-ci/unity-builder@v6
        env:
          # Jangan set UNITY_LICENSE (.ulf): di unity-builder v6 file .ulf diprioritaskan
          # dan aktivasi manual sudah ditolak Unity untuk lisensi Personal
          # ("TimeStamp validation failed"). Pakai aktivasi personal via email + password.
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_DIR }}
          targetPlatform: iOS
          unityVersion: auto
          cliVersion: v0.1.77

      # 4. Check Xcode build output
      - name: List build output
        run: |
          find . -maxdepth 4 -name "*.xcodeproj" \
            -not -path "./.git/*" || true

      # 5. Pilih Xcode 27 (iOS 27 SDK) secara eksplisit agar tidak ikut default image
      - name: Select Xcode 27
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos
        env:
          XCODE_VERSION: '27.1'

      # 6. Setup Ruby & Bundler
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ${{ env.PROJECT_DIR }}

      # 7. Fastlane External Beta
      - name: Fastlane External Beta
        working-directory: ${{ env.PROJECT_DIR }}
        run: bundle exec fastlane ios beta_external
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          MATCH_REPOSITORY: ${{ secrets.MATCH_REPOSITORY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
